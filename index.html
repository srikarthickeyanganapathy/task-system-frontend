    <!-- Apply the stored (or system) theme BEFORE first paint. Without this,
         light-theme users get a hardcoded dark flash and the pre-hydration
         class falls out of sync with ThemeProvider. Must match the storageKey
         in app/providers/ThemeProvider.jsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ryokai-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
        } catch (e) { /* default class="dark" stands */ }
      })();
    </script>
